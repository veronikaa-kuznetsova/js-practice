<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Forms</title>
</head>
<body>
  <div class="wrapper">
    <div class="form-container">
      <h2>Регистрация</h2>
      <form class="form" action="#" method="post" enctype="multipart/form-data">
        <label for="name">Имя</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Почта</label>
        <input type="email" id="email" name="email" required />

        <label for="age">Возраст</label>
        <input type="number" id="age" name="age" min="18" required />

        <label for="profession">
          Профессия:
        </label>

        <select id="profession" name="profession" required>
          <option value="programmer" selected>Программист</option>
          <option value="clown ">Клоун</option>
          <option value="modnik">Модник</option>
          <option value="other">Другая</option>
        </select>

        <div class="checkbox-group">
          <input type="checkbox" id="agree" name="agree" />
          <label for="agree">Согласен работать за еду</label>
        </div>

        <label for="photo">Фото</label>
        <input type="file" id="photo" name="photo" accept="image/*" required />

        <button type="submit" class="btn">
          <div class="loader hidden"></div>
          <span class="btn-text">Отправить заявку</span>
        </button>
      </form>
    </div>
  </div>
</body>
</html>
